[project]
name = "dlt-typesense"
version = "0.0.1"
description = "Typesense document destination for dlt (data load tool)"
readme = "README.md"
authors = [
    { name = "Marco Pesani", email = "marco.pesani@gmail.com" },
]
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["dlt", "typesense", "document-database", "elt", "search", "data-loading"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dlt>=1.9,<2",
    "typesense>=0.21",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/marcopesani/dlt-typesense"
Repository = "https://github.com/marcopesani/dlt-typesense"
Issues = "https://github.com/marcopesani/dlt-typesense/issues"

[project.entry-points."dlt.destinations"]
typesense = "dlt_typesense.factory:typesense"

[dependency-groups]
dev = [
    "basedpyright>=1.28",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_typesense"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
# dlt Destination / configspec patterns intentionally diverge from strict overrides
reportIncompatibleVariableOverride = "none"
reportIncompatibleMethodOverride = "none"
reportPrivateImportUsage = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Typesense server",
]
addopts = "-m 'not integration'"
