[project]
name = "dlt-typesense"
dynamic = ["version"]
description = "Typesense document destination for dlt (data load tool)"
readme = "README.md"
authors = [
    { name = "Marco Pesani", email = "marco.pesani@gmail.com" },
]
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["dlt", "typesense", "document-database", "elt", "search", "data-loading"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Floor is the oldest release that passes our suite; raise as needed.
    "dlt>=1.20,<2",
    "typesense>=2.0,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/marcopesani/dlt-typesense"
Repository = "https://github.com/marcopesani/dlt-typesense"
Issues = "https://github.com/marcopesani/dlt-typesense/issues"

# Short-name resolution: dlt scans the "dlt" pluggy group and imports
# `<package>.destinations.<name>` (see DestinationReference.find).
[project.entry-points."dlt"]
dlt-typesense = "dlt_typesense"

# Kept for tooling that looks up the destinations group; dlt itself does not.
[project.entry-points."dlt.destinations"]
typesense = "dlt_typesense.factory:typesense"

[dependency-groups]
dev = [
    "basedpyright>=1.28",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    # Real-source smoke tests (AC-SRC): sql_database over SQLite, filesystem over
    # CSV/JSONL/Parquet. rest_api ships with dlt. dlt's filesystem read_csv uses pandas.
    "sqlalchemy>=2",
    "pyarrow>=15",
    "pandas>=2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dlt_typesense/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/dlt_typesense",
    "tests",
    "examples",
    "docs",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
    "docker-compose.yml",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dlt_typesense"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
# dlt Destination / configspec patterns intentionally diverge from strict overrides
reportIncompatibleVariableOverride = "none"
reportIncompatibleMethodOverride = "none"
reportPrivateImportUsage = "none"
# dlt's schema TypedDicts mark nearly every key NotRequired; accessing well-known
# keys (table["name"], table["columns"]) directly is the idiom dlt itself uses.
reportTypedDictNotRequiredAccess = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running Typesense server",
]
addopts = "-m 'not integration'"
